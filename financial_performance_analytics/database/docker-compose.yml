services:
  postgres:
    image: postgres:18
    container_name: fpa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_performance_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-fpa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_dev}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - fpa_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  fpa_postgres_data:
