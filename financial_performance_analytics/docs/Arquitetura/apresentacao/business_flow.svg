<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowN" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 z" fill="#1e2a4a"/>
    </marker>
  </defs>

  <rect width="1080" height="1350" fill="#f5f6f8"/>
  <rect x="18" y="18" width="1044" height="1314" rx="14" fill="none" stroke="#1e2a4a" stroke-width="2"/>

  <!-- Header -->
  <circle cx="90" cy="55" r="3" fill="#1e2a4a"/>
  <line x1="103" y1="55" x2="313" y2="55" stroke="#1e2a4a" stroke-width="1.2"/>
  <text x="540" y="61" text-anchor="middle" font-size="17" letter-spacing="3" fill="#1e2a4a" font-weight="700">FINANCIAL PERFORMANCE ANALYTICS</text>
  <line x1="767" y1="55" x2="977" y2="55" stroke="#1e2a4a" stroke-width="1.2"/>
  <circle cx="990" cy="55" r="3" fill="#1e2a4a"/>

  <text x="540" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#16233f">Fluxo de Negócio até a DRE</text>
  <text x="540" y="168" text-anchor="middle" font-size="21" fill="#5b6b85">Da operação comercial à contabilização gerencial</text>

  <!-- Cliente -->
  <g filter="url(#cardShadow)"><rect x="140" y="205" width="800" height="118" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
  <rect x="140" y="205" width="9" height="118" rx="4" fill="#64748b"/>
  <circle cx="210" cy="264" r="34" fill="#f1f5f9"/>
  <g transform="translate(188,242)" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="16" r="8"/>
    <path d="M8,40 C8,28 16,24 24,24 C32,24 40,28 40,40"/>
  </g>
  <text x="266" y="257" font-size="27" font-weight="700" fill="#16233f">Cliente</text>
  <text x="266" y="286" font-size="17" fill="#64748b">erp_customers</text>
  <line x1="540" y1="323" x2="540" y2="357" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- Pedido -->
  <g filter="url(#cardShadow)"><rect x="140" y="357" width="800" height="118" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/></g>
  <rect x="140" y="357" width="9" height="118" rx="4" fill="#2563eb"/>
  <circle cx="210" cy="416" r="34" fill="#dbeafe"/>
  <g transform="translate(188,394)" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="8" width="24" height="32" rx="3"/>
    <rect x="18" y="6" width="12" height="6" rx="2"/>
    <line x1="17" y1="20" x2="31" y2="20"/>
    <line x1="17" y1="27" x2="31" y2="27"/>
    <line x1="17" y1="34" x2="26" y2="34"/>
  </g>
  <text x="266" y="409" font-size="27" font-weight="700" fill="#1d4ed8">Pedido</text>
  <text x="266" y="438" font-size="17" fill="#64748b">erp_sales_orders / erp_sales_order_items</text>
  <line x1="540" y1="475" x2="540" y2="509" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- Faturamento -->
  <g filter="url(#cardShadow)"><rect x="140" y="509" width="800" height="118" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/></g>
  <rect x="140" y="509" width="9" height="118" rx="4" fill="#2563eb"/>
  <circle cx="210" cy="568" r="34" fill="#dbeafe"/>
  <g transform="translate(188,546)" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12,6 H30 L36,12 V42 H12 Z"/>
    <path d="M30,6 V12 H36"/>
    <path d="M24,18 V32 M20.5,21 C20.5,19.3 22,18 24,18 C26.5,18 28,19.5 24,24 C20,28.5 21.5,30 24,30 C26,30 27.5,28.7 27.5,27"/>
  </g>
  <text x="266" y="561" font-size="27" font-weight="700" fill="#1d4ed8">Faturamento</text>
  <text x="266" y="590" font-size="17" fill="#64748b">erp_invoices / erp_invoice_items</text>

  <!-- Branch arrows -->
  <path d="M420,627 V650 H285 V675" fill="none" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>
  <path d="M660,627 V650 H795 V675" fill="none" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- Entrega -->
  <g filter="url(#cardShadow)"><rect x="140" y="686" width="390" height="130" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/></g>
  <rect x="140" y="686" width="9" height="130" rx="4" fill="#16a34a"/>
  <circle cx="205" cy="751" r="32" fill="#dcfce7"/>
  <g transform="translate(185,731)" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="18" width="22" height="14" rx="2"/>
    <path d="M26,22 H34 L40,28 V32 H26 Z"/>
    <circle cx="13" cy="34" r="3.2"/>
    <circle cx="33" cy="34" r="3.2"/>
  </g>
  <text x="255" y="744" font-size="24" font-weight="700" fill="#15803d">Entrega</text>
  <text x="255" y="772" font-size="16" fill="#64748b">erp_deliveries</text>

  <!-- Contabilizacao -->
  <g filter="url(#cardShadow)"><rect x="550" y="686" width="390" height="130" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/></g>
  <rect x="550" y="686" width="9" height="130" rx="4" fill="#7c3aed"/>
  <circle cx="615" cy="751" r="32" fill="#ede9fe"/>
  <g transform="translate(595,731)" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14,6 H28 L34,12 V42 H14 Z"/>
    <path d="M28,6 V12 H34"/>
    <line x1="18" y1="22" x2="30" y2="22"/>
    <line x1="18" y1="29" x2="30" y2="29"/>
    <line x1="18" y1="36" x2="26" y2="36"/>
  </g>
  <text x="665" y="744" font-size="24" font-weight="700" fill="#6d28d9">Contabilização</text>
  <text x="665" y="772" font-size="16" fill="#64748b">erp_journal_entries / lines</text>

  <!-- Converge -->
  <path d="M285,816 V850 H540" fill="none" stroke="#1e2a4a" stroke-width="2"/>
  <path d="M795,816 V850 H540" fill="none" stroke="#1e2a4a" stroke-width="2"/>
  <line x1="540" y1="850" x2="540" y2="882" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- DRE Gerencial -->
  <g filter="url(#cardShadow)"><rect x="140" y="886" width="800" height="140" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/></g>
  <rect x="140" y="886" width="9" height="140" rx="4" fill="#eab308"/>
  <circle cx="216" cy="956" r="38" fill="#fef9c3"/>
  <g transform="translate(192,932)" stroke="#a16207" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="40" x2="10" y2="30"/>
    <line x1="19" y1="40" x2="19" y2="24"/>
    <line x1="28" y1="40" x2="28" y2="16"/>
    <path d="M14,20 L24,10 L38,10 M38,10 V18"/>
  </g>
  <text x="278" y="943" font-size="28" font-weight="700" fill="#a16207">DRE Gerencial</text>
  <text x="278" y="973" font-size="18" fill="#334155">account_dre_mapping → dre_lines</text>
  <text x="278" y="999" font-size="16" fill="#64748b">resultado por linha, conformado ao real e ao budget</text>

  <!-- Footer -->
  <line x1="60" y1="1250" x2="1020" y2="1250" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="540" y="1284" text-anchor="middle" font-size="18" fill="#334155">A operação e a contabilização convergem em um único resultado</text>

  <g transform="translate(60,1300)">
    <circle cx="18" cy="18" r="18" fill="#eef2f7" stroke="#1e2a4a" stroke-width="1.2"/>
    <path d="M10,22 C10,14 14,10 18,10 C22,10 26,14 26,20 C26,24 24,26 22,26 L22,23 C22,21 21,20 19,20 L17,20 C15,20 14,22 14,24 L14,27" fill="none" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="15" cy="16" r="1" fill="#1e2a4a"/>
    <circle cx="21" cy="16" r="1" fill="#1e2a4a"/>
  </g>
  <text x="108" y="1313" font-size="13" fill="#94a3b8">financial_performance_analytics</text>
</svg>
