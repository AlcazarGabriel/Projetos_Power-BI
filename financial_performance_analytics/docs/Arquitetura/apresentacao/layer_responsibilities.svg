<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowN" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 z" fill="#1e2a4a"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1080" height="1350" fill="#f5f6f8"/>
  <rect x="18" y="18" width="1044" height="1314" rx="14" fill="none" stroke="#1e2a4a" stroke-width="2"/>

  <!-- Header -->
  <circle cx="90" cy="55" r="3" fill="#1e2a4a"/>
  <line x1="103" y1="55" x2="313" y2="55" stroke="#1e2a4a" stroke-width="1.2"/>
  <text x="540" y="61" text-anchor="middle" font-size="17" letter-spacing="3" fill="#1e2a4a" font-weight="700">FINANCIAL PERFORMANCE ANALYTICS</text>
  <line x1="767" y1="55" x2="977" y2="55" stroke="#1e2a4a" stroke-width="1.2"/>
  <circle cx="990" cy="55" r="3" fill="#1e2a4a"/>

  <text x="540" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#16233f">Papel de Cada Camada</text>
  <text x="540" y="168" text-anchor="middle" font-size="21" fill="#5b6b85">O que cada etapa do pipeline entrega</text>

  <!-- Cards x=140 width=800 height=140, gap 38, step 178 -->

  <!-- RAW -->
  <g filter="url(#cardShadow)"><rect x="140" y="205" width="800" height="140" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
  <rect x="140" y="205" width="9" height="140" rx="4" fill="#64748b"/>
  <circle cx="216" cy="275" r="38" fill="#f1f5f9"/>
  <g transform="translate(192,251)" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="24" cy="10" rx="16" ry="6"/>
    <path d="M8,10 V32 A16,6 0 0 0 40,32 V10"/>
    <path d="M8,21 A16,6 0 0 0 40,21"/>
  </g>
  <text x="278" y="262" font-size="27" font-weight="700" fill="#16233f">1. RAW</text>
  <text x="278" y="292" font-size="19" fill="#334155">Cópia fiel da origem</text>
  <text x="278" y="318" font-size="16" fill="#64748b">29 tabelas · carga incremental (SHA-256)</text>
  <line x1="540" y1="345" x2="540" y2="381" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- STAGING -->
  <g filter="url(#cardShadow)"><rect x="140" y="381" width="800" height="140" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/></g>
  <rect x="140" y="381" width="9" height="140" rx="4" fill="#2563eb"/>
  <circle cx="216" cy="451" r="38" fill="#dbeafe"/>
  <g transform="translate(192,427)" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8,10 H40 L26,26 V38 L22,36 V26 Z"/>
  </g>
  <text x="278" y="438" font-size="27" font-weight="700" fill="#1d4ed8">2. STAGING</text>
  <text x="278" y="468" font-size="19" fill="#334155">Tipagem e padronização</text>
  <text x="278" y="494" font-size="16" fill="#64748b">29 views · sem regra de negócio</text>
  <line x1="540" y1="521" x2="540" y2="557" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- INTERMEDIATE -->
  <g filter="url(#cardShadow)"><rect x="140" y="557" width="800" height="140" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/></g>
  <rect x="140" y="557" width="9" height="140" rx="4" fill="#7c3aed"/>
  <circle cx="216" cy="627" r="38" fill="#ede9fe"/>
  <g transform="translate(192,603)" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round">
    <circle cx="24" cy="24" r="8" fill="none" stroke-width="3"/>
    <circle cx="24" cy="24" r="3" fill="#7c3aed" stroke="none"/>
    <rect x="21.5" y="3" width="5" height="8" rx="1.5"/>
    <rect x="21.5" y="37" width="5" height="8" rx="1.5"/>
    <rect x="3" y="21.5" width="8" height="5" rx="1.5"/>
    <rect x="37" y="21.5" width="8" height="5" rx="1.5"/>
    <rect x="21.5" y="21.5" width="5" height="8" rx="1.5" transform="rotate(45 24 24)"/>
    <rect x="21.5" y="21.5" width="5" height="8" rx="1.5" transform="rotate(-45 24 24)"/>
    <rect x="21.5" y="21.5" width="5" height="8" rx="1.5" transform="rotate(135 24 24)"/>
    <rect x="21.5" y="21.5" width="5" height="8" rx="1.5" transform="rotate(-135 24 24)"/>
  </g>
  <text x="278" y="614" font-size="27" font-weight="700" fill="#6d28d9">3. INTERMEDIATE</text>
  <text x="278" y="644" font-size="19" fill="#334155">Regras de negócio</text>
  <text x="278" y="670" font-size="16" fill="#64748b">DRE · rateios · reconciliações</text>
  <line x1="540" y1="697" x2="540" y2="733" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- MARTS -->
  <g filter="url(#cardShadow)"><rect x="140" y="733" width="800" height="140" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/></g>
  <rect x="140" y="733" width="9" height="140" rx="4" fill="#16a34a"/>
  <circle cx="216" cy="803" r="38" fill="#dcfce7"/>
  <g transform="translate(192,779)" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24,5 L41,13.5 V32.5 L24,41 L7,32.5 V13.5 Z"/>
    <path d="M24,5 V23 M7,13.5 L24,23 L41,13.5 M24,23 V41"/>
  </g>
  <text x="278" y="790" font-size="27" font-weight="700" fill="#15803d">4. MARTS</text>
  <text x="278" y="820" font-size="19" fill="#334155">Fatos e dimensões para análise</text>
  <text x="278" y="846" font-size="16" fill="#64748b">4 fatos · 9 dimensões</text>

  <line x1="216" y1="873" x2="216" y2="925" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#arrowO)"/>

  <!-- CONTROL / QUALITY -->
  <g filter="url(#cardShadow)"><rect x="140" y="937" width="800" height="140" rx="14" fill="#ffffff" stroke="#fde3b8" stroke-width="2"/></g>
  <rect x="140" y="937" width="9" height="140" rx="4" fill="#f59e0b"/>
  <circle cx="216" cy="1007" r="38" fill="#fef3c7"/>
  <g transform="translate(192,983)" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24,4 L40,10 V22 C40,32 33,38 24,40 C15,38 8,32 8,22 V10 Z"/>
    <path d="M16,22 L21,27 L32,15"/>
  </g>
  <text x="278" y="994" font-size="27" font-weight="700" fill="#b45309">CONTROL / QUALITY</text>
  <text x="278" y="1024" font-size="19" fill="#334155">Auditoria contínua de todas as camadas</text>
  <text x="278" y="1050" font-size="16" fill="#64748b">pipeline_runs · ingestion_control · quality tests</text>

  <!-- Footer -->
  <line x1="60" y1="1250" x2="1020" y2="1250" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="540" y="1284" text-anchor="middle" font-size="18" fill="#334155">Cada camada existe para uma responsabilidade só</text>

  <g transform="translate(60,1300)">
    <circle cx="18" cy="18" r="18" fill="#eef2f7" stroke="#1e2a4a" stroke-width="1.2"/>
    <path d="M10,22 C10,14 14,10 18,10 C22,10 26,14 26,20 C26,24 24,26 22,26 L22,23 C22,21 21,20 19,20 L17,20 C15,20 14,22 14,24 L14,27" fill="none" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="15" cy="16" r="1" fill="#1e2a4a"/>
    <circle cx="21" cy="16" r="1" fill="#1e2a4a"/>
  </g>
  <text x="108" y="1313" font-size="13" fill="#94a3b8">financial_performance_analytics</text>
</svg>
